<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b18; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1f2a4f 0%, #0b0b18 70%); color: #bff3ff;
      font: bold 48px/1.2 "Trebuchet MS", Arial, sans-serif; letter-spacing: 4px; transition: opacity .4s;
    }
    #loading small { font-size: 16px; letter-spacing: 1px; color: #ffffffaa; margin-top: 8px; font-weight: normal; }
    #bar { width: min(360px, 70vw); height: 10px; margin-top: 28px; border-radius: 6px; background: #ffffff22; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #5fe6ff, #c9a2ff, #ffb35a); transition: width .2s; }
    #error { display: none; color: #ff9d9d; font-size: 16px; margin-top: 18px; max-width: 80vw; text-align: center; font-weight: normal; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading">
    SHIFTLING
    <small>a shapeshifting adventure</small>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script>
    var canvas = document.getElementById("game");
    var loading = document.getElementById("loading");
    var errorBox = document.getElementById("error");

    // Clicking the game gives it keyboard focus (needed inside the itch.io iframe).
    canvas.addEventListener("pointerdown", function () { canvas.focus(); window.focus(); });
    // Keep arrow keys / space from scrolling the surrounding page.
    window.addEventListener("keydown", function (e) {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) >= 0) e.preventDefault();
    }, { passive: false });

    function showBanner(msg, type) {
      if (type === "error") { errorBox.style.display = "block"; errorBox.textContent = msg; loading.style.opacity = 1; }
      else console.warn(msg);
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: showBanner,
      // Pixel art: render at 1 CSS pixel per pixel - sharper and much faster on high-DPI screens.
      devicePixelRatio: 1
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        loading.style.opacity = 0;
        setTimeout(function () { loading.style.display = "none"; }, 450);
        canvas.focus();
      }).catch(function (message) {
        showBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
